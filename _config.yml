# The Site Configuration

lang: en

timezone: America/New_York

title: "Wealth & Rich News"
tagline: "Financial News & Insights"
description: "Automated financial news from Wealth & Rich"
url: "https://wealthandrich.github.io/news"

github:
  username: wealthandrich

twitter:
  username: wealthandrich

social:
  name: Wealth & Rich
  email: info@wealthandrich.com
  links:
    - https://wealthandrich.com
    - https://t.me/cbinewschannel
    - https://twitter.com/wealthandrich
    - https://linkedin.com/company/wealthandrich

theme_mode: dark

avatar: "/commons/avatar.jpg"

toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  provider: 

paginate: 10
baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
